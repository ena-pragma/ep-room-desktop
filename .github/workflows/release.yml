# Builds EP Room Desktop from the private source commit named in release/SOURCE.json and publishes desktop-v<version> here.
# Canonical copy: ena-pragma/ep-room electron/release-repo/.github/workflows/release.yml (synced by its desktop-release workflow).
# Secrets: EP_ROOM_READ_KEY, a READ-ONLY deploy key of ena-pragma/ep-room (only the checkout steps get it).
# macOS (only the Mac build step gets these): CSC_LINK (base64 Developer ID Application p12) and CSC_KEY_PASSWORD sign it;
# APPLE_API_KEY (the App Store Connect .p8 contents), APPLE_API_KEY_ID and APPLE_API_ISSUER notarize it. With CSC_LINK set the
# Mac build is Developer ID signed, notarized and stapled, and installs its own updates; without it the build falls back to
# ad-hoc (EP_ROOM_MAC_ADHOC=1), which only tells the user to run `ep-room desktop update`.
# Windows is unsigned (named UNSIGNED-TEST), Linux needs none.
name: release

on:
  push:
    branches: [main]
    paths: ['release/SOURCE.json']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only; publish nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.s.outputs.version }}
      commit: ${{ steps.s.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: s
        run: |
          version=$(jq -r .version release/SOURCE.json); commit=$(jq -r .commit release/SOURCE.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version '$version'"; exit 1; }
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "bad commit '$commit'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"; echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "EP Room Desktop $version from ${commit:0:7}" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: mac, os: macos-15 }
          - { target: win, os: windows-2022 }
          - { target: linux, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      EP_ROOM_BUILD_COMMIT: ${{ needs.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ena-pragma/ep-room
          ref: ${{ needs.source.outputs.commit }}
          ssh-key: ${{ secrets.EP_ROOM_READ_KEY }}
          sparse-checkout: electron
          persist-credentials: false
          path: src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and test
        working-directory: src/electron
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "$v" = "${{ needs.source.outputs.version }}" ] || { echo "electron/package.json says $v, SOURCE.json says ${{ needs.source.outputs.version }}"; exit 1; }
          npm ci --no-audit --no-fund
          node --test test/updater.test.cjs test/mac-release.test.cjs test/package-win.test.cjs test/security.test.cjs test/config.test.cjs test/terminal.test.cjs test/terminal-pty.test.cjs
      - name: Build (macOS arm64 + x64; Developer ID signed and notarized, or ad-hoc without the secrets)
        if: matrix.target == 'mac'
        working-directory: src/electron
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          out=$(cd ../.. && pwd)/out; mkdir -p "$out"
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::CSC_LINK is not set: this Mac build is ad-hoc signed and cannot install its own updates"
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER
            EP_ROOM_MAC_ADHOC=1 node scripts/package-mac-release.mjs
            signed=0
          else
            [ -n "$CSC_KEY_PASSWORD" ] && [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ] \
              || { echo "CSC_LINK is set, so CSC_KEY_PASSWORD, APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER must be too"; exit 1; }
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"; printf '%s\n' "$APPLE_API_KEY_P8" > "$key"; chmod 600 "$key"
            unset APPLE_API_KEY_P8
            # electron-builder imports CSC_LINK into a temporary keychain, signs with the hardened runtime and the entitlements,
            # notarizes the app with the API key (APPLE_API_KEY is the key file's path) and staples the ticket before zipping.
            APPLE_API_KEY="$key" CSC_IDENTITY_AUTO_DISCOVERY=true EP_ROOM_MAC_X64=1 node scripts/package-mac-release.mjs
            signed=1
          fi
          cd dist/mac-release
          if [ "$signed" = 1 ]; then
            # The dmg is notarized and stapled too (a first install opens without a warning); stapling changes its bytes, so
            # latest-mac.yml's dmg entries are refreshed after.
            for d in EP-Room-Desktop-*-arm64.dmg EP-Room-Desktop-*-x64.dmg; do
              xcrun notarytool submit "$d" --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
              xcrun stapler staple "$d"
              xcrun stapler validate "$d"
            done
            node ../../scripts/refresh-update-yml.cjs latest-mac.yml EP-Room-Desktop-*.dmg
            rm -f EP-Room-Desktop-*.dmg.blockmap   # made before stapling, so stale; the updater uses the zip's
            rm -f "$key"
          fi
          for z in EP-Room-Desktop-*-arm64.zip EP-Room-Desktop-*-x64.zip; do
            d=$(mktemp -d); ditto -x -k "$z" "$d"; app="$d/EP Room Desktop.app"
            codesign --verify --deep --strict "$app"
            if [ "$signed" = 1 ]; then
              # Captured first: grep -q quits early, and under pipefail that can fail a pipe whose signature is fine.
              info=$(codesign -dvv "$app" 2>&1); ents=$(codesign -d --entitlements - "$app" 2>/dev/null)
              grep -q '^Authority=Developer ID Application:' <<<"$info" || { echo "$z: not Developer ID signed"; exit 1; }
              grep -q 'device.audio-input' <<<"$ents" || { echo "$z: no audio-input entitlement"; exit 1; }
              sp=$(spctl --assess --type execute -vv "$app" 2>&1 || true)
              echo "$sp" | grep -q 'accepted' && echo "$sp" | grep -q 'Notarized Developer ID' || { echo "$z: spctl: $sp"; exit 1; }
              xcrun stapler validate "$app"
            fi
            echo "$z: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist"), $(lipo -archs "$app/Contents/MacOS/EP Room Desktop"), $([ "$signed" = 1 ] && echo 'Developer ID, notarized, stapled' || echo 'ad-hoc'), signature ok"
          done
          echo "signed=$signed" > "$out/mac-signing.txt"
          cp EP-Room-Desktop-*.zip EP-Room-Desktop-*.dmg *.blockmap latest-mac.yml "$out/"
      - name: Terminal self-test (macOS, the packaged app starts a shell through node-pty)
        if: matrix.target == 'mac'
        working-directory: src/electron
        run: |
          node scripts/pty-selftest.mjs "dist/mac-release/mac-arm64/EP Room Desktop.app/Contents/MacOS/EP Room Desktop"
          x64_helper="dist/mac-release/mac/EP Room Desktop.app/Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-x64/spawn-helper"
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            # Under Rosetta a first launch can be slow: no answer in time (exit 3) is a warning plus the file check; a wrong answer fails.
            rc=0; EP_PTY_SELFTEST_TIMEOUT_MS=240000 node scripts/pty-selftest.mjs "dist/mac-release/mac/EP Room Desktop.app/Contents/MacOS/EP Room Desktop" || rc=$?
            if [ "$rc" = 3 ]; then echo "::warning::the x64 app did not answer under Rosetta in time; its node-pty is checked by file"; test -x "$x64_helper"
            elif [ "$rc" != 0 ]; then exit "$rc"; fi
          else
            echo "no Rosetta on this runner: the x64 app's node-pty is checked by file only"
            test -x "$x64_helper"
          fi
      - name: Build (Windows x64, unsigned)
        if: matrix.target == 'win'
        working-directory: src/electron
        shell: bash
        run: |
          npm run package:win
          mkdir -p ../../out
          cp dist/win/EP-Room-Desktop-Setup-*.exe dist/win/EP-Room-Desktop-Setup-*.exe.blockmap dist/win/latest.yml ../../out/
          node scripts/pty-selftest.mjs "dist/win/win-unpacked/EP Room Desktop.exe"
      - name: Build (Linux x64, AppImage + deb)
        if: matrix.target == 'linux'
        working-directory: src/electron
        run: |
          npm run package:linux
          mkdir -p ../../out
          cp dist/linux/EP-Room-Desktop-*.AppImage dist/linux/EP-Room-Desktop-*.deb dist/linux/latest-linux.yml ../../out/
          cp dist/linux/*.blockmap ../../out/ 2>/dev/null || true
          command -v xvfb-run >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q xvfb; }
          xvfb-run -a node scripts/pty-selftest.mjs dist/linux/linux-unpacked/ep-room-desktop --no-sandbox
      - run: ls -la out
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [source, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        working-directory: files
        run: |
          v='${{ needs.source.outputs.version }}'
          for f in latest-mac.yml latest.yml latest-linux.yml; do grep -q "^version: $v$" "$f" || { echo "$f is not version $v"; exit 1; }; done
          # mac-signing.txt is the Mac build's note to the release text, not a release file.
          if grep -qx 'signed=1' mac-signing.txt; then mac='Developer ID signed and notarized; updates install themselves.'; else mac='ad-hoc signed, not notarized.'; fi
          echo "MAC_SIGNING=$mac" >> "$GITHUB_ENV"; rm -f mac-signing.txt
          sha256sum * > SHA256SUMS
          cat SHA256SUMS; { echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish desktop-v${{ needs.source.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v='${{ needs.source.outputs.version }}'; c='${{ needs.source.outputs.commit }}'
          if gh release view "desktop-v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "desktop-v$v already exists; not replacing it"; exit 1; fi
          notes="EP Room Desktop $v, built from source ${c:0:7}.

          Install or update: \`npx -y github:ena-pragma/ep-room-desktop\` or \`ep-room desktop update\`.
          macOS: $MAC_SIGNING Windows: unsigned. Checksums: SHA256SUMS."
          gh release create "desktop-v$v" files/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "EP Room Desktop $v" --notes "$notes" --latest
      - name: Read the feed back
        run: |
          v='${{ needs.source.outputs.version }}'
          for f in latest-mac.yml latest.yml latest-linux.yml; do
            for i in 1 2 3 4 5 6; do curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$f" | grep -q "^version: $v$" && break; sleep 10; done
            curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$f" | grep -q "^version: $v$" || { echo "the feed's $f is not $v"; exit 1; }
            echo "$f: $v"
          done
